name: Keep Neon awake

# 每 3 分钟请求一次后端保活接口，防止 Neon 免费版 5 分钟自动休眠。
# 即使 GitHub Actions 调度有 1~2 分钟延迟，总间隔仍小于 5 分钟。
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: curl keepalive
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://medication-platform.vercel.app/api/keepalive)
          echo "keepalive http=$code"
