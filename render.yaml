# Render 蓝图部署配置（放在仓库根目录，Render 会自动识别）
# Blueprint 部署：Render 控制台 → New → Blueprint → 选此仓库
services:
  - type: web
    name: zhiyouyao-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # 在 Render 控制台手动填 Neon 连接串
      - key: JWT_SECRET_KEY
        generateValue: true  # Render 自动生成强随机密钥
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false  # 在 Render 控制台填前端域名，例如 https://xxx.vercel.app
      - key: APP_NAME
        value: "智药护航 API"
      - key: ENVIRONMENT
        value: "production"
      - key: COZE_TOKEN
        sync: false
      - key: COZE_BOT_ID
        sync: false
      - key: ZHIPU_API_KEY
        sync: false